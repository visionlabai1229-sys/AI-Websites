<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>VisionLab AI — Newman Post</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }

    .scale-wrapper {
      width: 1080px;
      height: 1080px;
      transform-origin: center center;
      transform: scale(var(--scale, 1));
      flex-shrink: 0;
    }

    .canvas {
      width: 1080px;
      height: 1080px;
      position: relative;
      background: #0a0c10;
      overflow: hidden;
    }

    /* Grain texture */
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      pointer-events: none;
      z-index: 1;
    }

    /* Ambient glows */
    .glow-teal {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 195, 215, 0.13) 0%, transparent 65%);
      top: -300px;
      right: -200px;
      z-index: 0;
    }

    .glow-orange {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 166, 35, 0.09) 0%, transparent 65%);
      bottom: -150px;
      left: -100px;
      z-index: 0;
    }

    .glow-mid {
      position: absolute;
      width: 350px;
      height: 350px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 195, 215, 0.07) 0%, transparent 65%);
      bottom: 300px;
      left: 350px;
      z-index: 0;
    }

    /* Main layout */
    .content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    /* Left panel */
    .left {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 68px 52px 68px 72px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 195, 215, 0.08);
      border: 1px solid rgba(0, 195, 215, 0.22);
      border-radius: 100px;
      padding: 9px 20px;
      width: fit-content;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00c3d7;
      box-shadow: 0 0 8px rgba(0, 195, 215, 0.9);
    }

    .badge-text {
      font-size: 12px;
      font-weight: 600;
      color: #00c3d7;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .middle-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 28px 0 20px;
    }

    .stat-block {
      margin-bottom: 32px;
    }

    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: 140px;
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: -0.04em;
      color: #00c3d7;
      text-shadow: 0 0 60px rgba(0, 195, 215, 0.35), 0 0 120px rgba(0, 195, 215, 0.12);
      margin-bottom: 4px;
    }

    .stat-unit {
      font-size: 22px;
      font-weight: 500;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .headline {
      font-size: 34px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .headline .dim {
      color: rgba(255,255,255,0.45);
      font-weight: 400;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(90deg, rgba(0, 195, 215, 0.6), transparent);
      border-radius: 2px;
      margin-bottom: 24px;
    }

    .subtext {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.65;
      color: rgba(255,255,255,0.38);
      max-width: 340px;
    }

    /* Quote block */
    .quote-block {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-left: 3px solid rgba(0, 195, 215, 0.5);
      border-radius: 12px;
      padding: 22px 24px;
      margin-bottom: 40px;
    }

    .quote-text {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-style: italic;
      color: rgba(255,255,255,0.82);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .quote-attr {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.04em;
    }

    /* Bottom bar */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-svg {
      display: block;
    }

    .url-tag {
      font-size: 13px;
      font-weight: 500;
      color: rgba(0, 195, 215, 0.5);
      letter-spacing: 0.03em;
    }

    /* Right panel — browser mockup */
    .right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 56px 56px 56px 20px;
      position: relative;
    }

    .browser-wrap {
      position: relative;
      width: 100%;
      max-width: 430px;
    }

    .browser-shadow {
      position: absolute;
      inset: -2px;
      border-radius: 18px;
      background: transparent;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 24px 80px rgba(0, 0, 0, 0.7),
        0 8px 24px rgba(0, 195, 215, 0.08);
    }

    .browser-chrome {
      background: #1a1d24;
      border-radius: 14px 14px 0 0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .browser-dots {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .browser-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-red   { background: #ff5f57; }
    .dot-yellow{ background: #febc2e; }
    .dot-green { background: #28c840; }

    .browser-bar {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.28);
      letter-spacing: 0.02em;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .browser-body {
      overflow: hidden;
      border-radius: 0 0 14px 14px;
      position: relative;
      height: 380px;
    }

    .browser-body img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    /* Gradient fade on browser image */
    .browser-fade {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      background: linear-gradient(to bottom, transparent, rgba(10, 12, 16, 0.85));
      pointer-events: none;
    }

    /* Live badge on browser */
    .live-badge {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 12, 16, 0.82);
      border: 1px solid rgba(0, 195, 215, 0.3);
      border-radius: 100px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      backdrop-filter: blur(8px);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00c3d7;
      box-shadow: 0 0 6px rgba(0, 195, 215, 1);
    }

    .live-text {
      font-size: 12px;
      font-weight: 600;
      color: #00c3d7;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
