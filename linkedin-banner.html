<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>LinkedIn Banner</title>
<!--
  LinkedIn profile banner, 1584x396. Layout follows the reference crop in
  images/reference/ (workspace repo).
  Export: bash run.sh node linkedin-banner-screenshot.mjs [label] [--guides]
  Plan: plans/2026-11-19-linkedin-banner.md (workspace repo).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04060E;
    --fg: #FFFFFF;
    --teal: #00C2D4;
    --orange: #F08C00;
    --muted: rgba(255,255,255,.62);
    --col: 879px;          /* left edge of the text column */
    --col-end: 1530px;     /* right edge of the text column */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; }
  body {
    position: relative;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Background (base surface) ---------- */
  .bg-base {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 260px 260px at 660px 380px, rgba(4,6,14,.95), rgba(4,6,14,0) 100%),
      linear-gradient(90deg, #0D1119 0%, #04060E 38%);
  }
  .bg-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 690px 140px, rgba(0,194,212,.22) 0px, rgba(0,194,212,.06) 180px, transparent 280px);
  }
  .bg-grain {
    position: absolute; inset: 0;
    opacity: .06;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---------- Proof strip band (elevated surface) ---------- */
  .strip {
    position: absolute; left: 830px; right: 0; top: 280px; bottom: 0;
    background: rgba(255,255,255,.06);
    border-top: 1px solid rgba(255,255,255,.06);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 90px);
            mask-image: linear-gradient(90deg, transparent 0, #000 90px);
  }

  /* ---------- Photo ---------- */
  .photo {
    position: absolute;
    left: 509px; top: 14px;
    height: 396px; width: auto;
    /* no glow or shadow on the image: the erased laptop edge is straight */
  }

  /* ---------- Corner tag ---------- */
  .tag {
    position: absolute; left: 42px; top: 33px;
    display: flex; align-items: baseline; gap: 12px;
    white-space: nowrap;
  }
  .tag-main { font-weight: 700; font-size: 26px; letter-spacing: -.02em; line-height: 1; }
  .tag-emoji { font-size: 21px; line-height: 1; transform: translateY(1px); }
  .tag-note { font-weight: 600; font-size: 14px; color: var(--muted); line-height: 1; }

  /* ---------- Headline ---------- */
  .headline {
    position: absolute; left: var(--col); top: 65px;
    width: calc(var(--col-end) - var(--col));
    font-weight: 700; font-size: 46px; line-height: 1.08; letter-spacing: -.03em;
    white-space: nowrap;
  }
  .acc { color: var(--orange); }

  /* ---------- Credential row ---------- */
  .creds {
    position: absolute; left: var(--col); top: 203px; height: 24px;
    display: flex; align-items: center;
    white-space: nowrap;
  }
  .cred { display: flex; align-items: center; gap: 26px; }
  .cred + .cred { margin-left: 32px; }
  .cred svg { width: 24px; height: 24px; flex: none; }
  .cred span {
    font-weight: 700; font-size: 14px; letter-spacing: .2em; text-transform: uppercase;
    color: rgba(255,255,255,.92);
  }

  /* ---------- Proof strip content ---------- */
  .proof {
    position: absolute; left: var(--col); top: 344px; transform: translateY(-50%);
    display: flex; align-items: center;
    white-space: nowrap;
  }
  .proof-label {
    font-weight: 700; font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--teal);
  }
  .proof-num {
    margin-left: 28px;
    font-weight: 600; font-size: 36px; letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
  }
  .proof-note {
    margin-left: 28px;
    font-weight: 500; font-size: 15px; line-height: 1.35;
    color: rgba(255,255,255,.58);
  }

  /* ---------- Guides mode (?guides=1) ---------- */
  .guide { display: none; }
  body.guides .guide { display: block; }
  .guide-avatar {
    position: absolute; left: 48px; top: 205px; width: 320px; height: 320px;
    border-radius: 50%; border: 8px solid #fff; overflow: hidden; background: #ddd;
  }
  .guide-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .guide-line { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px dashed rgba(240,140,0,.6); }
  body.guides .headline, body.guides .creds, body.guides .proof { outline: 1px dashed rgba(240,140,0,.6); }
</style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="bg-glow"></div>
  <div class="bg-grain"></div>
  <div class="strip"></div>

  <!-- PHOTO: swap the src to change the photo -->
  <img class="photo" src="stephen-rivas-banner-nobg.png" alt="">

  <!-- CORNER TAG -->
  <div class="tag">
    <span class="tag-main">DM me “TEST”</span>
    <span class="tag-emoji">☎️</span>
    <span class="tag-note">( free front-desk test )</span>
  </div>

  <!-- HEADLINE (option A) -->
  <h1 class="headline">AI receptionists that <span class="acc">answer</span><br><span class="acc">every call</span> (even after 5pm).</h1>

  <!-- CREDENTIALS: keep both true to the signed terms (agreement §3 + proposal guarantee) -->
  <div class="creds">
    <div class="cred">
      <svg viewBox="0 0 24 24" fill="none" stroke="#00C2D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2.8l7.2 3v5.4c0 4.5-3.1 8.4-7.2 10-4.1-1.6-7.2-5.5-7.2-10V5.8L12 2.8z"/>
        <path d="M8.6 12.1l2.4 2.4 4.4-4.8"/>
      </svg>
      <span>Money-back guarantee</span>
    </div>
    <div class="cred">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F08C00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4.5" y="10.5" width="15" height="10.5" rx="2.2"/>
        <path d="M8 10.5V7a4 4 0 0 1 7.6-1.7"/>
        <path d="M12 14.6v2.6"/>
      </svg>
      <span>No long-term contract</span>
    </div>
  </div>

  <!-- PROOF STRIP -->
  <div class="proof">
    <span class="proof-label">Call it live</span>
    <span class="proof-num">(365) 360-4080</span>
    <span class="proof-note">Book a test appointment.</span>
  </div>

  <!-- GUIDES (hidden unless ?guides=1) -->
  <div class="guide guide-avatar"><img src="linkedin-banner/linkedin-avatar-final.png" alt=""></div>
  <div class="guide guide-line" style="left:879px"></div>
  <div class="guide guide-line" style="left:1530px"></div>

  <script>
    if (new URLSearchParams(location.search).has('guides')) document.body.classList.add('guides');
  </script>
</body>
</html>
